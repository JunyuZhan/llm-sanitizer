name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite (unit + CLI + e2e)
        run: python3 tests/test_e2e.py
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Smoke test package import and CLI
        shell: bash
        run: |
          python3 -c "import llm_sanitizer; print('version', llm_sanitizer.__version__)"
          python3 -m llm_sanitizer status >/dev/null
