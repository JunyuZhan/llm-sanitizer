[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sanitizer-gateway"
version = "0.5.3"
description = "Local AI traffic privacy gateway — mask sensitive data before it leaves your machine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["privacy", "llm", "masking", "gateway", "ai-agent", "sanitizer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# 图片 OCR 脱敏(可选特性,ADR-1 核心零依赖不受影响;另需系统级 tesseract + chi_sim 语言包)
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=9.0",
]
# 桌面轻包:原生窗口打开控制台(可选特性;macOS 自动安装 pyobjc 依赖)
desktop = [
    "pywebview>=4.0",
]

[project.scripts]
llm-sanitizer = "llm_sanitizer.cli:main"

[tool.setuptools]
packages = ["llm_sanitizer"]
